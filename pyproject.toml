[project]
name="pvs"
version="0.1.0"
description="Diffusion models for protein virtual staining"
requires-python=">=3.11"
dependencies=[
    "torch>=2.2"
]
[dependency-groups]
dev=[
    "pytest>=8.0"
]
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["src/pvs"]
