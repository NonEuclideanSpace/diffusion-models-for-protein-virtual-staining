[project]
name="pvs"
version="0.1.0"
description="Diffusion models for protein virtual staining"
requires-python=">=3.11"
dependencies=[
    "torch>=2.2",
    "numpy>=1.26",
    "transformers>=4.45",
]

[dependency-groups]
dev=[
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["src/pvs"]
